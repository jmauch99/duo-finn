<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duo Finn · Finanças em casal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8e8ec; --card:#ffffff; --bd:#ececee; --tx:#0a0a0f; --mut:#6b6b76; --mut2:#9a9aa5; --line:#eeeef0;
  --blue:#2563eb; --navy:#1e3a8a; --green:#16a34a; --pink:#ff3d6e; --red:#ef4444; --amber:#f59e0b;
  --hover:#f4f4f5; --chip:#eaf0fd; --seg:#efeff2; --segsel:#ffffff; --gbar:#e5e7eb; --box:#f5f5f6;
  --boxsel:#dbe6fb; --shadow:0 1px 2px rgba(16,16,24,.04); --pop:0 12px 40px rgba(16,16,24,.16);
  --cur:#71717a; --btn:#ffffff; --overlay:rgba(10,10,15,.42);
}
[data-theme=dark]{
  --bg:#0b0c10; --card:#15171c; --bd:#262a33; --tx:#f4f4f6; --mut:#a1a1ad; --mut2:#7c7c88; --line:#23262e;
  --hover:#1d2028; --chip:#1b2540; --seg:#1d2028; --segsel:#2a2e39; --gbar:#2c303a; --box:#1c1f26;
  --boxsel:#1b2a4d; --shadow:none; --pop:0 12px 40px rgba(0,0,0,.55); --cur:#8b8b97; --btn:#1d2028; --overlay:rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,-apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{display:block}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);gap:22px;padding:14px 22px 22px 14px;min-height:100vh;max-width:1760px;margin:0 auto}
/* ---------- sidebar ---------- */
.side{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px 10px 12px;display:flex;flex-direction:column;position:sticky;top:14px;height:calc(100vh - 28px);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:9px;padding:6px 10px 18px}
.avs{display:flex}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;border:2px solid var(--card)}
.av.b{background:var(--blue)} .av.p{background:#f43f5e;margin-left:-9px}
.brand b{display:block;font-size:14px;font-weight:700;line-height:1.2}
.brand small{font-size:11.5px;color:var(--mut)}
.sec{font-size:11.5px;color:var(--mut);padding:8px 14px 6px;font-weight:500}
.nav{display:flex;flex-direction:column;gap:1px;margin-bottom:12px}
.nav button{display:flex;align-items:center;gap:11px;height:33px;padding:0 14px;border-radius:10px;font-size:13.5px;font-weight:500;color:#26262e;text-align:left}
[data-theme=dark] .nav button{color:#d4d4dc}
.nav button svg{width:16px;height:16px;flex:none;color:#4b4b56}
[data-theme=dark] .nav button svg{color:#a1a1ad}
.nav button:hover{background:var(--hover)}
.nav button.on{background:var(--hover);font-weight:600}
.nav button.on svg{color:var(--blue)}
.side .grow{flex:1}
.tema{display:flex;align-items:center;gap:9px;padding:10px 14px;font-size:13.5px;font-weight:500;color:var(--mut)}
.tema svg{width:16px;height:16px}
.tema .tg{margin-left:auto;display:flex;background:var(--seg);border-radius:10px;padding:3px;gap:2px}
.tema .tg button{width:30px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--mut)}
.tema .tg button.on{background:var(--segsel);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tema .tg svg{width:14px;height:14px}
.me{border-top:1px solid var(--line);margin:4px 4px 0;padding:12px 6px 4px;display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:12px}
.me:hover{background:var(--hover)}
.me .av{border:0;width:30px;height:30px}
.me b{display:block;font-size:13px;font-weight:600;line-height:1.2}
.me small{font-size:11px;color:#c2750a;display:flex;align-items:center;gap:5px}
.me small i{width:6px;height:6px;background:#f59e0b;border-radius:50%;display:inline-block}
.me small.s-ok{color:var(--green)}.me small.s-ok i{background:var(--green)}
.me small.s-local,.me small.s-login{color:var(--mut)}.me small.s-local i,.me small.s-login i{background:var(--mut2)}
.me small.s-off{color:var(--red)}.me small.s-off i{background:var(--red)}
.lock{position:fixed;inset:0;z-index:999;background:var(--bg);display:grid;place-items:center;padding:20px}
.lk{width:100%;max-width:370px;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--pop)}
.lk h3{font-size:20px;letter-spacing:-.02em;margin-top:6px}.lk label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut);font-weight:500}
.lk input{height:40px;border:1px solid var(--bd);border-radius:11px;padding:0 12px;background:var(--bg);color:var(--tx);font-size:14px}
.lk input:focus{outline:2px solid var(--blue);outline-offset:-1px}
.lk .btn{height:42px;justify-content:center;margin-top:4px}.lkerr{min-height:16px;font-size:12.5px;color:var(--red)}
.lk .brand{padding:0 0 6px}
.me>svg{margin-left:auto;width:14px;height:14px;color:var(--mut)}
/* ---------- main ---------- */
main{min-width:0;padding-top:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--shadow)}
.top{display:flex;align-items:center;height:58px;padding:0 14px 0 16px;margin-bottom:16px}
.top .arrows{display:flex;gap:6px;margin-right:16px;align-items:center}
.top .arrows button{width:22px;height:30px;display:grid;place-items:center;color:var(--tx)}
.top .arrows button:first-child{color:var(--mut2)}
.top .arrows svg{width:16px;height:16px}
.mtitle{display:flex;align-items:center;gap:8px;font-size:27px;font-weight:700;letter-spacing:-.03em;padding:4px 6px;border-radius:10px}
.mtitle:hover{background:var(--hover)}
.mtitle .y{color:#85858f;font-weight:500}
.mtitle svg{width:14px;height:14px;color:var(--mut);margin-top:4px}
.top .sp{flex:1}
.bell{position:relative;width:36px;height:36px;border:1px solid var(--bd);border-radius:11px;display:grid;place-items:center;margin-right:8px;background:var(--btn)}
.bell svg{width:16px;height:16px}
.bell .bd{position:absolute;top:-7px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:#e11d48;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card);line-height:1}
.addb{display:flex;height:36px;border-radius:11px;background:var(--blue);color:#fff;overflow:hidden}
.addb button{color:#fff;font-size:13px;font-weight:600;padding:0 18px}
.addb button:hover{background:#1d4ed8}
.addb .dd{padding:0 10px;border-left:1px solid rgba(255,255,255,.28);display:grid;place-items:center}
.addb .dd svg{width:14px;height:14px}
.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.colL,.colR{display:flex;flex-direction:column;gap:16px;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
.pad{padding:22px 21px}
.ct{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.sub{font-size:12.5px;color:var(--mut);font-weight:400}
.mut{color:var(--mut)}
/* big numbers */
.big{display:flex;align-items:baseline;gap:.2em;font-weight:800;letter-spacing:-.035em;line-height:1;white-space:nowrap}
.big .cur{color:var(--cur);font-weight:700}
.big .cts{color:var(--cur);font-size:.42em;font-weight:500;letter-spacing:0;margin-left:-.18em}
.big .neg{color:var(--tx)}
.big.xl{font-size:44px} .big.lg{font-size:36px} .big.md{font-size:31px}
.ico{display:block;mix-blend-mode:multiply;pointer-events:none;user-select:none}
[data-theme=dark] .ico{mix-blend-mode:normal;background:#fff;border-radius:16px;padding:3px}
/* saldo */
.saldo{position:relative}
.saldo .row{display:flex;align-items:center;gap:22px;margin:30px 0 26px;min-height:64px}
.saldo .vl{width:1px;height:32px;background:var(--bd);margin-left:-4px}
.saldo .tx1{font-size:13.5px;font-weight:700;color:var(--green);display:flex;align-items:center;gap:6px}
.saldo .tx1.neg{color:var(--red)}
.saldo .tx1 svg{width:13px;height:13px}
.saldo .tx2{font-size:12.5px;color:var(--mut);margin-top:3px}
.saldo .wal{position:absolute;right:38px;top:20px;width:122px}
.seg{display:flex;height:10px;gap:2px;border-radius:6px;overflow:hidden}
.seg i{display:block;min-width:0;height:100%}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 10px;margin-top:15px}
.legend .l{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend .l i{width:6px;height:6px;border-radius:50%;display:inline-block}
.legend .v{font-size:13.5px;font-weight:700;margin-top:4px;white-space:nowrap;letter-spacing:-.01em;display:flex;align-items:center;gap:4px}
.legend .v em{font-style:normal;font-weight:400;color:var(--mut);font-size:11px}
.legend .v svg{width:12px;height:12px;color:var(--mut);margin-left:2px}
.legend .v.g{color:var(--green)}
.legend .v.rd{color:var(--red)}
.linkb{cursor:pointer}.linkb:hover{opacity:.75}
/* divisão */
.div{display:flex;flex-direction:column;position:relative}
.div .big{margin-top:6px}
.div .ic{position:absolute;right:20px;top:14px;width:92px}
.who{display:flex;justify-content:space-between;margin-top:20px;font-size:12px;color:var(--mut)}
.who .r{text-align:right}
.who .l span,.who .r span{display:inline-flex;align-items:center;gap:5px}
.who i{width:6px;height:6px;border-radius:50%;display:inline-block}
.who b{display:block;color:var(--tx);font-size:14.5px;font-weight:700;margin-top:3px;letter-spacing:-.01em}
.dbar{position:relative;display:flex;height:26px;margin:9px 0 22px;border-radius:9px;overflow:visible}
.dbar .a,.dbar .b{display:flex;align-items:center;color:#fff;font-size:11px;font-weight:600;padding:0 9px;min-width:0;overflow:hidden;white-space:nowrap}
.dbar .a{background:var(--blue);border-radius:9px 0 0 9px}
.dbar .b{background:var(--pink);border-radius:0 9px 9px 0;justify-content:flex-end;flex:1}
.dbar .mk{position:absolute;left:50%;top:-5px;bottom:-5px;width:2px;background:var(--tx);margin-left:-1px;border-radius:1px}
.sm{font-size:12px;font-weight:700;margin-bottom:4px}
.list .it{display:flex;align-items:center;height:40px;gap:10px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;letter-spacing:-.005em}
.list .it:last-child{border-bottom:0}
.list .it i{width:8px;height:8px;border-radius:50%;flex:none}
.list .it span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .it b{font-weight:600}
.list .it:hover{background:var(--hover);margin:0 -8px;padding:0 8px;border-radius:8px}
.foot{margin:auto -21px -22px;border-top:1px solid var(--line);padding:14px 21px;display:flex;align-items:center;gap:8px;margin-top:22px}
.foot .tx{font-size:12px;color:var(--mut);flex:1;display:flex;align-items:center;gap:8px;line-height:1.35}
.foot .tx b{color:var(--tx);font-weight:700}
.foot .av{width:20px;height:20px;font-size:9.5px;border:0;margin:0}
.foot .ar{width:12px;height:12px;color:var(--mut)}
.btn{border:1px solid var(--bd);background:var(--btn);border-radius:10px;height:34px;padding:0 14px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.pri:hover{background:#1d4ed8}
.btn.dng{color:var(--red)}
.btn.ok{background:#e8f6ed;border-color:#bfe5cc;color:var(--green)}
[data-theme=dark] .btn.ok{background:#12301f;border-color:#1b4a2e}
/* cartões */
.cards{position:relative;display:flex;flex-direction:column}
.cards .ic{position:absolute;right:26px;top:18px;width:84px}
.cards .big{margin-top:6px}
.crow{display:flex;align-items:center;justify-content:space-between;margin:18px 0 14px}
.circ{width:30px;height:30px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;background:var(--btn)}
.circ svg{width:14px;height:14px}
.circ[disabled]{opacity:.35;cursor:default}
.crow .nv{display:flex;gap:8px}
.vp{overflow:hidden;margin-right:-22px;border-radius:0}
.track{display:flex;gap:10px;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.cc{flex:0 0 76%;aspect-ratio:1.586;border-radius:16px;padding:16px 18px;color:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden;cursor:pointer}
.cc.dark{background:linear-gradient(135deg,#3a3a3d,#222224 55%,#2f2f32);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.cc.dark::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);mix-blend-mode:screen;pointer-events:none}
.cc.dark::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 45%,transparent 60%);pointer-events:none}
.cc.orange{background:linear-gradient(135deg,#f07a05,#e56a00)}
.cc.purple{background:linear-gradient(135deg,#8a14e0,#6d0cb8)}
.cc.blue{background:linear-gradient(135deg,#2f6bf0,#1d4ed8)}
.cc.red{background:linear-gradient(135deg,#e5303a,#c21d28)}
.cc.green{background:linear-gradient(135deg,#17a34a,#0f7a37)}
.cc.black{background:linear-gradient(135deg,#1c1c1f,#0a0a0b)}
.cc>*{position:relative;z-index:1}
.cc .t{display:flex;align-items:center;justify-content:space-between;height:26px}
.cc .lg{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;letter-spacing:-.01em}
.cc .lg svg{width:17px;height:17px}
.cc .itau{width:28px;height:28px;border-radius:7px;background:#1c3f94;color:#ff7a00;font-weight:800;font-size:11px;display:grid;place-items:center;letter-spacing:-.04em}
.cc .pill{background:rgba(255,255,255,.2);font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:7px}
.cc .m{flex:1;display:flex;align-items:center;justify-content:space-between;gap:6px}
.cc .chip{width:36px;height:27px;border-radius:6px;background:linear-gradient(135deg,#f5f5f6,#a9a9ae);position:relative;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.cc .chip::before{content:"";position:absolute;left:12px;right:12px;top:0;bottom:0;border-left:1px solid rgba(0,0,0,.28);border-right:1px solid rgba(0,0,0,.28)}
.cc .chip::after{content:"";position:absolute;left:0;right:0;top:9px;bottom:9px;border-top:1px solid rgba(0,0,0,.28);border-bottom:1px solid rgba(0,0,0,.28)}
.cc .prod{letter-spacing:.42em;font-size:10px;font-weight:700;margin-left:.42em;opacity:.9}
.cc .nfc{width:17px;height:17px;opacity:.85}
.cc .b{display:flex;justify-content:space-between;align-items:flex-end}
.cc small{display:block;font-size:8.5px;letter-spacing:.12em;opacity:.65;font-weight:500;margin-bottom:3px}
.cc .b b{font-size:12.5px;font-weight:600;letter-spacing:-.01em}
.cc .b .r{text-align:right}
.prx{font-size:10.5px;letter-spacing:.1em;font-weight:700;color:var(--mut);margin:22px 0 10px;text-transform:uppercase}
.pf{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pf .bx{position:relative;height:168px;border-radius:14px;background:var(--box);overflow:hidden;cursor:pointer;border:2px solid transparent;text-align:center;font-size:12px;font-weight:600;padding-top:12px}
.pf .bx.on{border-color:var(--blue);background:var(--card)}
.pf .bx .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#dbe6fb,#c9daf9)}
[data-theme=dark] .pf .bx .fill{background:linear-gradient(180deg,#22407f,#1b3569)}
.pf .bx .bg{display:inline-block;margin-top:5px;font-size:9px;font-weight:600;color:var(--blue);background:var(--chip);border-radius:6px;padding:2px 7px}
.pf .bx .v{position:absolute;left:0;right:0;bottom:15px;font-size:12px;font-weight:700;color:var(--mut)}
.pf .bx.on .v{color:var(--blue)}
.pf .bx .pt{position:absolute;left:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--card);border:2px solid var(--mut2);z-index:2}
.pf .bx.on .pt{border-color:var(--blue)}
.pf svg.ln{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
/* contas a pagar */
.pagar{position:relative}
.pagar .ic{position:absolute;right:22px;top:16px;width:84px}
.pagar .hd{display:flex;align-items:center;gap:8px;font-size:13px}
.pagar .hd b{font-weight:600}
.pagar .hd span{color:var(--mut);font-size:12px}
.pagar .hd span:before{content:"• ";font-size:10px}
.pagar .big{margin:12px 0 10px}
.pagar .s{font-size:12px;color:var(--mut)}
.pagar .s b{color:var(--tx);font-weight:600}
.tabs{display:flex;gap:8px;margin:18px 0 8px;overflow-x:auto;padding:2px 1px 6px}
.tabs::-webkit-scrollbar{height:0}
.tab{flex:1 0 62px;height:44px;border:1px solid var(--bd);border-radius:12px;background:var(--btn);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;font-weight:700}
.tab .d{display:flex;gap:2px;height:4px}
.tab .d i{width:3px;height:3px;border-radius:50%;background:#c4c4cc;display:block}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.3)}
.tab.on .d i{background:#fff}
.plist{max-height:268px;overflow:auto;margin:0 -4px;padding:0 4px}
.pr{display:flex;align-items:center;height:42px;gap:12px;border-bottom:1px solid var(--line);font-size:13px}
.pr:last-child{border-bottom:0}
.pr .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid #b9b9c2;flex:none;display:grid;place-items:center;color:#fff;background:transparent}
.pr .ck svg{width:11px;height:11px;opacity:0}
.pr.pg .ck{background:var(--green);border-color:var(--green)}
.pr.pg .ck svg{opacity:1}
.pr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;letter-spacing:-.005em}
.pr b{font-weight:600;white-space:nowrap}
.pr.pg .nm,.pr.pg b{color:var(--mut2);text-decoration:line-through}
.empty{padding:22px 0;color:var(--mut);font-size:12.5px;text-align:center}
/* moradia */
.mor{position:relative}
.mor .ic{position:absolute;right:30px;top:20px;width:92px}
.mor .big{margin-top:6px}
.pctl{display:flex;align-items:center;gap:7px;font-size:12px;margin-top:12px;color:var(--mut)}
.pctl b{color:var(--green);font-weight:700;font-size:12.5px}
.pctl b.w{color:var(--amber)}.pctl b.r{color:var(--red)}
.pctl svg{width:13px;height:13px;color:var(--green)}
.sc{display:grid;grid-template-columns:1fr 1fr;background:var(--seg);border-radius:11px;padding:3px;margin:22px 0 0;gap:2px}
.sc button{height:28px;border-radius:9px;font-size:12px;font-weight:500;color:var(--mut)}
.sc button.on{background:var(--segsel);color:var(--tx);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.mbar{position:relative;height:18px;background:var(--seg);border-radius:6px;margin:26px 0 8px}
.mbar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px 0 0 6px;background:var(--green)}
.mbar i.w{background:var(--amber)}.mbar i.r{background:var(--red)}
.mbar .mk{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--tx);left:50%;margin-left:-1px}
.mbar .mk span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:600;color:var(--mut)}
.mscale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut2)}
.sm2{font-size:12.5px;font-weight:700;margin:22px 0 14px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.chip2{display:flex;align-items:center;gap:11px;min-width:0;cursor:pointer}
.chip2 .t{width:38px;height:38px;border-radius:12px;background:var(--chip);color:var(--blue);display:grid;place-items:center;flex:none}
.chip2 .t svg{width:16px;height:16px}
.chip2 small{display:block;font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.chip2 b{display:block;font-size:13px;font-weight:700;margin-top:1px;letter-spacing:-.01em;white-space:nowrap}
.chip2>div{min-width:0}
/* obra */
.obra{position:relative;grid-column:1/-1}
.obra .ic{position:absolute;right:30px;top:12px;width:82px}
.obra .vv{display:flex;align-items:center;gap:10px;margin:8px 0 6px}
.obra .vv .big{font-size:26px}
.obra .vv .big .cur{font-size:.55em}
.badge{background:#fdf3cf;color:#8a6a0a;font-size:11px;font-weight:600;padding:3px 9px;border-radius:8px}
[data-theme=dark] .badge{background:#3a2f0b;color:#f3cf6a}
.obra .nt{font-size:11.5px;color:var(--mut)}
.obrafull{grid-column:1/-1}
/* generic pages */
.page{display:flex;flex-direction:column;gap:16px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h2{font-size:18px;font-weight:700;letter-spacing:-.02em}
.ph p{font-size:12.5px;color:var(--mut);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;padding:0 10px 10px}
td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--hover)}
.pos{color:var(--green);font-weight:600}.negc{color:var(--red);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.stat .k{font-size:12px;color:var(--mut)}
.stat .big{margin-top:8px;font-size:30px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:8px;background:var(--seg);color:var(--mut)}
.tag.b{background:var(--chip);color:var(--blue)}.tag.p{background:#ffe4ec;color:#d61f55}

.bankcard{display:flex;align-items:center;gap:14px}
.bankcard .sw{width:52px;height:34px;border-radius:7px;flex:none}
/* layer: popovers + modal */
.ov{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .15s}

.modal.wide{width:min(560px,100%)}
.modal h3{font-size:16px;font-weight:700;letter-spacing:-.02em;margin-bottom:16px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:5px}
.fld input[type=date]{width:100%;height:38px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);padding:0 12px;font-size:13.5px;outline:none;font-family:inherit;color-scheme:light}
[data-theme=dark] .fld input[type=date]{color-scheme:dark}
.fld input[type=text],.fld select{width:100%;height:38px;border:1px solid var(--bd);border-radius:10px;background:var(--card);padding:0 12px;font-size:13.5px;outline:none}
.fld input:focus,.fld select:focus,.fld input[type=date]:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.fld.ck{display:flex;align-items:center;gap:9px}
.fld.ck label{margin:0;font-weight:500;color:var(--tx);font-size:13px}
.fld.ck input{width:16px;height:16px;accent-color:var(--blue)}
.fld .hint{font-size:11.5px;color:var(--mut2);margin-top:4px}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.mrow .sp{flex:1}
.pop{position:fixed;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--pop);z-index:60;padding:6px;min-width:200px;animation:fade .12s}
.pop button.mi{display:flex;width:100%;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:500;text-align:left}
.pop button.mi:hover{background:var(--hover)}
.pop button.mi svg{width:15px;height:15px;color:var(--mut)}
.pop .sep{height:1px;background:var(--line);margin:5px 4px}

.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px}
.mg button{height:36px;border-radius:9px;font-size:12.5px;font-weight:500}
.mg button:hover{background:var(--hover)}
.mg button.on{background:var(--blue);color:#fff;font-weight:600}
.yr{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 6px;font-weight:700;font-size:14px}
.yr button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.yr button:hover{background:var(--hover)}.yr svg{width:14px;height:14px}
.nt1{display:flex;gap:10px;align-items:center;padding:9px 12px;font-size:12.5px;border-radius:9px}
.nt1 span{flex:1}
.nt1 b{font-weight:600}
.nt1 em{font-style:normal;color:var(--mut);font-size:11.5px}
.itens .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.itens .row span{flex:1}
.itens .row .x{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--mut)}
.itens .row .x:hover{background:var(--hover);color:var(--red)}
.itens .row .x svg{width:13px;height:13px}
.inl{display:flex;gap:8px;margin-top:12px}
.inl input{flex:1;height:36px;border:1px solid var(--bd);border-radius:10px;background:var(--card);padding:0 12px;outline:none;min-width:0}
.inl input.v{flex:0 0 110px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#16171c;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:500;z-index:80;box-shadow:var(--pop);animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.toast{animation:none}
/* categorias, ações, parcelas */
.ctag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--mut);white-space:nowrap}
.ctag i{width:8px;height:8px;border-radius:3px;display:inline-block;flex:none}
.acts{display:flex;gap:2px;justify-content:flex-end}
.ib{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--mut)}

.ib.dng:hover{color:var(--red);background:rgba(239,68,68,.1)}
.ib svg{width:14px;height:14px}
.catnew{display:flex;gap:8px;margin-top:8px}
.catnew[hidden]{display:none}
.catnew input{flex:1;height:36px;border:1px solid var(--bd);border-radius:10px;background:var(--card);padding:0 12px;outline:none;min-width:0}
.catnew input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.catnew select{width:auto!important;flex:0 0 auto}
.fld input[type=color]{width:64px;height:38px;padding:3px;border:1px solid var(--bd);border-radius:10px;background:var(--card);cursor:pointer}
.parc{font-style:normal;font-size:10.5px;font-weight:600;background:var(--chip);color:var(--blue);border-radius:6px;padding:2px 6px;margin:0 6px}
.itens .row .x.e:hover{color:var(--blue)}
.itens .row .ctag{margin-left:8px}
.cbar{height:6px;border-radius:4px;background:var(--seg);overflow:hidden;min-width:90px}
.cbar i{display:block;height:100%;border-radius:4px}
.sechd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.tfoot td{font-weight:700;background:transparent!important}
.pill-btn{cursor:pointer}
/* seletor de adicionar */
.addg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.addg button{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--card);transition:border-color .15s,background .15s}
.addg button:hover{border-color:var(--blue);background:var(--hover)}
.addg svg{width:20px;height:20px;color:var(--blue);flex:none;margin-top:1px}
.addg b{display:block;font-size:13.5px;margin-bottom:2px}.addg small{color:var(--mut);font-size:11.5px;line-height:1.35;display:block}
.addh{font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.07em;text-transform:uppercase;margin:16px 0 0}
@media (max-width:520px){.addg{grid-template-columns:1fr}}
/* faturas retráteis */
.fat{border:1px solid var(--line);border-radius:16px;margin-top:12px;background:var(--card);overflow:hidden;transition:box-shadow .25s}
.fat.open{box-shadow:0 6px 22px rgba(16,16,24,.07)}
.fh{display:flex;align-items:center;gap:18px;padding:14px 16px;cursor:pointer;user-select:none;outline:none}
.fh:hover{background:var(--hover)}.fh:focus-visible{box-shadow:inset 0 0 0 2px rgba(37,99,235,.4)}
.fh .bankcard{flex:1;min-width:0}
.fh .fm{text-align:right;min-width:104px}
.fh .fm .sub{display:block;font-size:11.5px}
.fh .fm b{display:block;font-variant-numeric:tabular-nums;font-size:14.5px}
.fh .chev{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:var(--mut);transition:transform .35s cubic-bezier(.3,.8,.3,1);flex:none}
.fh .chev svg{width:16px;height:16px}
.fat.open .chev{transform:rotate(180deg)}
.fb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.3,.8,.3,1)}
.fat.open .fb{grid-template-rows:1fr}
.fi{overflow:hidden;min-height:0;opacity:0;transition:opacity .3s ease;padding:0 16px}
.fat.open .fi{opacity:1;padding:2px 16px 16px;border-top:1px solid var(--line)}
.ftools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
@media (max-width:760px){.fh{flex-wrap:wrap;gap:10px}.fh .fm{min-width:80px}}
/* carrossel de cartões */
.stage{position:relative;height:272px;margin:12px -6px 0;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;outline:none;border-radius:16px}
.stage.drag{cursor:grabbing}
.stage:focus-visible{box-shadow:0 0 0 3px rgba(37,99,235,.28)}
.stage .cc{position:absolute;left:50%;top:50%;flex:none;transition:transform .6s cubic-bezier(.22,.82,.25,1),opacity .5s ease,filter .5s ease;will-change:transform,opacity}
.stage.drag .cc{transition:none}
.cc.img{padding:0;border-radius:0;display:block;background-color:transparent;background-size:100% 100%;background-repeat:no-repeat;container-type:inline-size;overflow:visible}
.cc.land{--a:2.5cqw;--b:4.1cqw}
.cc.port{--a:4.5cqw;--b:6.4cqw}
.cc.img .mask{position:absolute;display:flex;flex-direction:column;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);background:linear-gradient(135deg,rgba(8,8,12,.5),rgba(8,8,12,.3));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.22)}
.cc.land .mask{left:var(--ml,5.2cqw);bottom:var(--mb,6.4cqw);width:var(--mw,53cqw);padding:2.5cqw 3.2cqw;border-radius:3.2cqw;gap:1.9cqw}
.cc.port .mask{left:6cqw;right:6cqw;top:var(--mt,40%);padding:3.2cqw 4cqw;border-radius:4.6cqw;gap:2.4cqw}
.mask small{display:block;font-size:var(--a);font-weight:600;letter-spacing:.11em;opacity:.82;line-height:1.1;text-transform:uppercase}
.mask b{display:block;font-size:var(--b);font-weight:700;letter-spacing:-.01em;line-height:1.1;margin-top:.28em;white-space:nowrap}
.mask .mg{display:grid;grid-template-columns:1fr 1fr;gap:2cqw}
.mask .stl{display:inline-flex;align-items:center;gap:1.5cqw;align-self:flex-start;font-size:var(--a);font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:.9cqw 2.2cqw;border-radius:99px;background:rgba(255,255,255,.2);line-height:1.2;white-space:nowrap}
.mask .stl i{width:1.9cqw;height:1.9cqw;border-radius:50%;background:#4ade80;display:block;flex:none}
.mask .stl.fech i{background:#fbbf24}
.mask .stl.paga i{background:#93c5fd}
.cdots{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 2px 0;font-size:12px;color:var(--mut);font-weight:500;min-height:14px}
.cdots .d{display:flex;gap:6px;align-items:center}
.cdots .d button{width:7px;height:7px;border-radius:4px;background:var(--gbar);transition:all .35s}
.cdots .d button.on{width:20px;background:var(--blue)}
.sw.imgsw{background-size:cover;background-position:50% 22%;background-repeat:no-repeat}
.tag.am{background:#fef3c7;color:#92400e}
[data-theme=dark] .tag.am{background:#3a2f0b;color:#f3cf6a}
.ckb{width:20px;height:20px;border-radius:50%;border:1.5px solid #b9b9c2;display:inline-grid;place-items:center;color:transparent;background:transparent}
.ckb.on{background:var(--green);border-color:var(--green);color:#fff}
.ckb svg{width:11px;height:11px}
tr.grp td{background:var(--hover);font-weight:700;font-size:12px;letter-spacing:.02em;border-top:0;padding-top:9px;padding-bottom:9px}
tr.grp td.n{font-variant-numeric:tabular-nums}
tr.done td{color:var(--mut2)}
@media (max-width:1240px){
  .grid{grid-template-columns:1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr;padding:10px}
  .side{position:static;height:auto}
  .nav{flex-direction:row;flex-wrap:wrap}
  .two{grid-template-columns:1fr}
  .legend{grid-template-columns:repeat(2,1fr)}
  .big.xl{font-size:36px}
  .saldo .wal{width:78px;right:16px}
  .saldo .row{flex-wrap:wrap}
  .top{flex-wrap:wrap;height:auto;padding:10px 14px;gap:8px}
}

.yr{display:flex;align-items:center;gap:10px}.yr b{font-size:14px;text-align:center;min-width:48px}
.gc svg{width:100%;height:auto;margin-top:8px}.gc .sub{margin-top:2px}
.ax{font-size:10.5px;fill:var(--mut)}.vl{font-size:9.5px;font-weight:600;fill:var(--tx)}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:12px;color:var(--mut)}
.lgd i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.gg{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.donutw{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;align-items:center;margin-top:10px}
.donutw svg{margin:0}
.rk{width:24px;color:var(--mut);font-size:12px}
.tt td{font-weight:700;border-top:1.5px solid var(--bd)}
.rsecs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.rsec{display:flex;align-items:center;gap:7px;height:30px;padding:0 12px 0 8px;border:1px solid var(--bd);border-radius:9px;font-size:12.5px;background:var(--btn)}
.rtl{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.paper{--bg:#fff;--card:#fff;--bd:#dcdce2;--tx:#14141a;--mut:#5f5f6b;--mut2:#9a9aa6;--line:#e8e8ee;--gbar:#ececf1;--seg:#f0f0f4;--green:#15803d;--red:#dc2626;
  background:#fff;color:#14141a;border-radius:6px;padding:34px 38px;box-shadow:0 2px 18px rgba(0,0,0,.18);max-width:900px;width:100%;margin:0 auto;font-size:12.5px}
.paper h1{font-size:27px;letter-spacing:-.03em;margin:4px 0}
.paper h2{font-size:15px;margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid #14141a;break-after:avoid}
.paper h3{font-size:12.5px;margin:16px 0 6px;color:#3a3a44;break-after:avoid}
.paper table{font-size:11.5px}.paper td{padding:6px 8px}.paper th{padding:0 8px 6px;font-size:10px}
.paper tr{break-inside:avoid}
.paper ul{margin:10px 0 0 18px;line-height:1.6}
.paper svg{width:100%;height:auto}
.paper .rg svg{width:200px;height:200px}
.paper .rh{border-bottom:3px solid #2563eb;padding-bottom:12px}
.rkk{font-size:10.5px;letter-spacing:.14em;color:#2563eb;font-weight:700}.rs{font-size:11.5px;color:#5f5f6b}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kp>div{border:1px solid #dcdce2;border-radius:8px;padding:10px 12px;break-inside:avoid}
.kp small{display:block;font-size:10.5px;color:#5f5f6b}.kp b{display:block;font-size:17px;margin:2px 0;letter-spacing:-.02em}
.kp .neg,.paper .neg{color:#dc2626}
.dl{font-size:10px;font-weight:600}.dl.ok{color:#15803d}.dl.bad{color:#dc2626}
.nota{font-size:10.5px;color:#5f5f6b;margin-top:8px;line-height:1.5}
.ft{margin-top:20px;padding-top:8px;border-top:1px solid #dcdce2;font-size:10px;color:#8a8a96;text-align:center}
.rg{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center}
.mx td,.mx th{padding:5px 4px;font-size:10px}
@media (max-width:860px){.donutw,.rg{grid-template-columns:1fr}.gg{grid-template-columns:1fr}.kp{grid-template-columns:repeat(2,1fr)}.paper{padding:18px}}
@media print{
  @page{size:A4;margin:14mm 13mm}
  html,body{height:auto;background:#fff!important}
  .app{display:block;padding:0;max-width:none}
  .side,.top,.ph,.rptools,#layer,.toast{display:none!important}
  .page{display:block}
  .paper{box-shadow:none;border-radius:0;padding:0;max-width:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

function layoutStage(dx = 0) {

  const W = st.clientWidth, H = st.clientHeight; if (!W) return;
  const els = [...st.querySelectorAll('.cc')]; const idx = state.ui.card;

  const wa = dim[idx] ? dim[idx].w : 0;
  const v1 = clamp(W / 2 - wa / 2 - 6, 18, W * .2);
  els.forEach((el, i) => {
    const d = i - idx, ad = Math.abs(d), sc = Math.max(.62, 1 - .15 * ad);
    const { w, h } = dim[i];
    let tx = 0;
    if (d !== 0) { const far = wa / 2 + v1 + (ad - 1) * W * .08; tx = Math.sign(d) * (far - w * sc / 2); }
    el.style.width = w + 'px'; el.style.height = h + 'px';
    el.style.marginLeft = (-w / 2) + 'px'; el.style.marginTop = (-h / 2) + 'px';
    el.style.transform = `translateX(${tx + dx}px) scale(${sc})`;
    el.style.opacity = ad === 0 ? 1 : ad === 1 ? .92 : ad === 2 ? .5 : 0;
    el.style.zIndex = 10 - ad;
    el.style.filter = ad === 0 ? 'drop-shadow(0 16px 16px rgba(0,0,0,.28))' : 'brightness(.8) saturate(.88) drop-shadow(0 8px 8px rgba(0,0,0,.18))';
    el.style.pointerEvents = ad > 2 ? 'none' : 'auto';
  });
}

    } else {
      const d2 = x => x.dia ? pad2(x.dia) + '/' + pad2(pm.m + 1) : '–';
      const grp = (titulo, arr, pag) => arr.length ? `<h3>${titulo}</h3><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th>${pag ? '<th>Pagamento</th>' : ''}<th class="n">Valor</th></tr></thead><tbody>${[...arr].sort((a, b) => (a.dia || 99) - (b.dia || 99)).map(x => `<tr><td>${d2(x)}</td><td>${esc(x.nome)}${x.soReg ? ' (só registro)' : ''}</td><td>${catTag(x.cat) || '–'}</td>${pag ? `<td>${x.cartao ? 'Cartão · ' + esc(cc(x.cartao)) : 'Conta'}</td>` : ''}<td class="n">${brl(x.valor)}</td></tr>`).join('')}<tr class="tt"><td colspan="${pag ? 4 : 3}">Subtotal</td><td class="n">${brl(r2(arr.reduce((a, x) => a + x.valor, 0)))}</td></tr></tbody></table>` : '';
      h += grp('Gastos fixos (contas da casa e gastos pessoais)', itens.filter(i => i.tipo === 'Conta da casa' || i.tipo === 'Gasto pessoal fixo'), true);
      h += grp('Despesas gerais', itens.filter(i => i.tipo === 'Despesa geral'), false);
      state.cartoes.forEach(c => { h += grp('Compras no cartão · ' + esc(cardNome(c)), itens.filter(i => i.tipo === 'Compra no cartão' && i.cartao === c.id), false); });
      h += grp('Rendas extras', itens.filter(i => i.def === 'renda'), false);
      if (!itens.length) h += '<div class="empty">Sem lançamentos detalhados.</div>';
    }
  }
  // 5 cartões
  if (sec.cart && state.cartoes.length) {
    h += H('Cartões de crédito');
    h += `<table><thead><tr><th>Cartão</th><th class="n">Limite</th><th class="n">Fatura${ano ? 's no ano' : ' do mês'}</th>${ano ? '' : '<th class="n">Limite usado</th><th class="n">Vencimento</th><th>Status</th>'}</tr></thead><tbody>${state.cartoes.map(c => { const f = keys.reduce((a, k) => a + fat(c.id, k).valor, 0); return `<tr><td>${esc(cardNome(c))}</td><td class="n">${brl(c.limite)}</td><td class="n">${brl(f)}</td>${ano ? '' : `<td class="n">${c.limite ? pct1(limiteUsado(c) / c.limite) : '—'}</td><td class="n">${ddmm(vencData(c, cfg.mes))}</td><td>${STL[fatStatus(c, cfg.mes)]}</td>`}</tr>`; }).join('')}<tr class="tt"><td>Total</td><td class="n">${brl(r2(state.cartoes.reduce((a, c) => a + c.limite, 0)))}</td><td class="n">${brl(fatT)}</td>${ano ? '' : '<td colspan="3"></td>'}</tr></tbody></table>`;
    const pa = parcelasAbertas(last);
    if (pa.length) h += `<h3>Parcelamentos em aberto ao fim de ${MESES[parseKey(last).m].toLowerCase()}</h3><table><thead><tr><th>Compra</th><th>Cartão</th><th class="n">Parcela</th><th class="n">Valor da parcela</th><th class="n">Restante a pagar</th></tr></thead><tbody>${pa.map(x => `<tr><td>${esc(x.c.desc)}</td><td>${esc(cc2(x.c.cartao))}</td><td class="n">${x.cur}/${x.c.parcelas}</td><td class="n">${brl(x.parc)}</td><td class="n">${brl(x.rest)}</td></tr>`).join('')}<tr class="tt"><td colspan="4">Compromisso futuro em parcelas</td><td class="n">${brl(r2(pa.reduce((a, x) => a + x.rest, 0)))}</td></tr></tbody></table>`;
  }
  // 6 investimentos
  if (sec.inv) {
    h += H('Investimentos'); const ia = investAcum(last);
    if (!ano) {
      const m = mesRO(keys[0]); const l = m.invest || [];
      h += l.length ? `<table><thead><tr><th>Dia</th><th>Investimento</th><th>Categoria</th><th>Status</th><th class="n">Aporte</th></tr></thead><tbody>${l.map(x => `<tr><td>${pad2(x.dia)}/${pad2(pm.m + 1)}</td><td>${esc(x.nome)}</td><td>${catTag(x.cat) || '–'}</td><td>${m.pagos[x.id] ? 'Aportado' : 'Pendente'}</td><td class="n">${brl(x.valor)}</td></tr>`).join('')}<tr class="tt"><td colspan="4">Total aportado no mês</td><td class="n">${brl(inv)}</td></tr></tbody></table>` : '<div class="empty">Nenhum aporte neste mês.</div>';
    } else {
      h += `<table><thead><tr><th>Mês</th><th class="n">Aporte do mês</th><th class="n">Acumulado lançado</th><th class="n">Aportado (pago)</th></tr></thead><tbody>${keys.map(k => { const a = investAcum(k); return `<tr><td>${MESES[parseKey(k).m]}${k > hoje ? ' *' : ''}</td><td class="n">${brl(serieK(k).invest)}</td><td class="n">${brl(a.prev)}</td><td class="n">${brl(a.real)}</td></tr>`; }).join('')}<tr class="tt"><td>Total no ano</td><td class="n">${brl(inv)}</td><td colspan="2"></td></tr></tbody></table>`;
    }
    h += `<div class="nota">Acumulado lançado: ${brl(ia.prev)} · aportado (marcado como pago): ${brl(ia.real)}${ent > 0 ? ` · ${pct1(inv / ent)} da renda do período aportada` : ''}.</div>`;
  }
  h += `<div class="nota" style="margin-top:18px"><b>Notas.</b> Entradas, despesas e resultado seguem o regime de caixa (o dinheiro sai no vencimento da fatura do cartão). O quadro de categorias segue a data do gasto. “Dia a dia” é um orçamento estimado, não lançamentos individuais. Valores de meses futuros são previsões.</div><div class="ft">Gerado pelo Duo Finn · ${new Date().toLocaleString('pt-BR')} · Documento para controle pessoal, sem valor fiscal.</div>`;
  return h;
}
const cc2 = id => { const c = state.cartoes.find(z => z.id === id); return c ? cardNome(c) : '—'; };
function imprimirRel() {
  const c = relCfg(), old = document.title;
  document.title = 'Relatório Duo Finn - ' + (c.tipo === 'ano' ? c.ano : MESES[parseKey(c.mes).m] + ' ' + parseKey(c.mes).y);
  const back = () => { document.title = old; window.removeEventListener('afterprint', back); };
  window.addEventListener('afterprint', back); window.print();
}
function pageRelatorios() {
  const c = relCfg(); const ano = c.tipo === 'ano'; const pm = parseKey(c.mes);
  const SEC = [['fluxo', 'Fluxo de caixa'], ['cat', 'Categorias'], ['det', 'Detalhamento'], ['cart', 'Cartões'], ['inv', 'Investimentos']];
  return `<div class="page"><div class="ph"><div><h2>Relatórios</h2><p>Monte um relatório consolidado do mês ou do ano e salve em PDF.</p></div><button class="btn pri" data-act="pdf">${SI.dl.replace('<svg', '<svg style="width:15px;height:15px;margin-right:6px;vertical-align:-3px"')}Gerar PDF</button></div>
  <div class="card pad rptools"><div class="rtl"><div class="sc" style="width:210px;margin:0"><button class="${ano ? '' : 'on'}" data-reltipo="mes">Mensal</button><button class="${ano ? 'on' : ''}" data-reltipo="ano">Anual</button></div>
    <div class="yr"><button class="circ" data-relnav="-1">${SI.cl}</button><b style="min-width:150px">${ano ? c.ano : MESES[pm.m] + ' ' + pm.y}</b><button class="circ" data-relnav="1">${SI.cr}</button></div></div>
    <div class="rsecs"><span class="sub">Incluir:</span>${SEC.map(([k, l]) => `<button class="rsec ${c.sec[k] ? 'on' : ''}" data-relsec="${k}"><span class="ckb ${c.sec[k] ? 'on' : ''}">${SI.check}</span>${l}</button>`).join('')}</div>
    <div class="sub" style="margin-top:10px">O resumo executivo sempre entra. Ao clicar em “Gerar PDF”, escolha <b>Salvar como PDF</b> como destino de impressão (papel A4).</div></div>
  <article class="paper">${relHTML(c)}</article></div>`;
}


const VIEWS = { graficos: pageGraficos, relatorios: pageRelatorios, geral, fluxo: pageFluxo, cartoes: pageCartoes, casa: pageCasa, reserva: pageReserva, renda: pageRenda, contas: pageContas, gerais: pageGerais, invest: pageInvest, categorias: pageCategorias };

/* =========================================================
   Render + eventos
   ========================================================= */
function render() {
  document.documentElement.dataset.theme = state.tema;
  const v = VIEWS[state.ui.view] ? state.ui.view : 'geral';
  state.ui.view = v;
  const sy = window.scrollY;
  $('#app').innerHTML = sidebar() + `<main>${topbar()}${VIEWS[v]()}</main>`;
  window.scrollTo(0, sy);
  layoutStage();
  save();
}
function goMes(k) { ensureMes(k); state.mes = k; state.ui.dia = null; render(); }

document.addEventListener('click', e => {
  const t = e.target;
  const q = s => t.closest(s);
  let el;
  const doEd = v => {
    const [tp, id] = v.split('|');
    if (tp === 'casa') editCasa(id); else if (tp === 'pes') editPessoal(id); else if (tp === 'inv') editInvest(id);
    else if (tp === 'ext') editExtra(id); else if (tp === 'cat') editCategoria(id); else if (tp === 'cartao') editCartao(id);
    else if (tp === 'compra') editCompra(id, null, state.mes);
    else if (tp === 'ger') editGeral(id); else if (tp === 'sal' || tp === 'dia') editRenda(); else if (tp === 'fatura') verFatura(id, state.mes); else if (tp === 'fbase') editBase(id, state.mes);
  };
  if ((el = q('[data-del]'))) {
    const [tp, id] = el.dataset.del.split('|');
    if (tp === 'casa') delItem('casa', id); else if (tp === 'pes') delItem('pessoais', id); else if (tp === 'inv') delItem('invest', id);
    else if (tp === 'ext') delItem('extras', id); else if (tp === 'cat') delCategoria(id); else if (tp === 'cartao') delCartao(id);
    else if (tp === 'compra') delCompra(id);
    else if (tp === 'ger') delItem('gerais', id); else if (tp === 'fbase') { if (confirm('Zerar os outros gastos sem detalhamento desta fatura?')) { setFat(id, state.mes, { valor: 0 }); save(); render(); } } else if (tp === 'sal') zerarCampo('salario', 'o salário'); else if (tp === 'dia') zerarCampo('diaADia', 'o orçamento do dia a dia');
    return;
  }
  if ((el = q('[data-ed]'))) { doEd(el.dataset.ed); return; }
  if ((el = q('[data-rowed]')) && !q('[data-pago]')) { doEd(el.dataset.rowed); return; }
  if ((el = q('[data-ftgl]'))) {
    const box = el.closest('.fat'); const id = el.dataset.ftgl; state.ui.fopen = state.ui.fopen || {};
    const on = box.classList.toggle('open'); el.setAttribute('aria-expanded', on);
    if (on) state.ui.fopen[id] = true; else delete state.ui.fopen[id];
    save(); return;
  }
  if ((el = q('[data-fnew]'))) { editCompra(null, el.dataset.fnew, state.mes); return; }
  if ((el = q('[data-fbase]'))) { editBase(el.dataset.fbase, state.mes); return; }
  if ((el = q('[data-fpay]'))) { const m = M(); const id = 'f-' + el.dataset.fpay; m.pagos[id] = !m.pagos[id]; render(); return; }
  if ((el = q('[data-fall]'))) { state.ui.fopen = {}; if (el.dataset.fall === '1') state.cartoes.forEach(c => { state.ui.fopen[c.id] = true; }); render(); return; }
  if ((el = q('[data-gano]'))) { state.ui.gAno = (state.ui.gAno || parseKey(state.mes).y) + +el.dataset.gano; render(); return; }
  if ((el = q('[data-gcat]'))) { state.ui.gCat = el.dataset.gcat; render(); return; }
  if ((el = q('[data-reltipo]'))) { relCfg().tipo = el.dataset.reltipo; render(); return; }
  if ((el = q('[data-relnav]'))) { const r = relCfg(), d = +el.dataset.relnav; if (r.tipo === 'ano') r.ano += d; else r.mes = addMonths(r.mes, d); render(); return; }
  if ((el = q('[data-relsec]'))) { const r = relCfg(); r.sec[el.dataset.relsec] = !r.sec[el.dataset.relsec]; render(); return; }
  if ((el = q('[data-view]'))) { state.ui.view = el.dataset.view; render(); return; }
  if ((el = q('[data-tema]'))) { state.tema = el.dataset.tema; render(); return; }
  if ((el = q('[data-dia]'))) { state.ui.dia = +el.dataset.dia; render(); return; }
  if ((el = q('[data-pago]'))) { const m = M(); const id = el.dataset.pago; m.pagos[id] = !m.pagos[id]; render(); return; }
  if ((el = q('[data-pedit]'))) {
    const [tp, ref] = el.dataset.pedit.split('|');
    if (tp === 'casa') editCasa(ref); else if (tp === 'pessoal') editPessoal(ref); else if (tp === 'invest') editInvest(ref); else verFatura(ref, state.mes);
    return;
  }
  if ((el = q('[data-casa]'))) { editCasa(el.dataset.casa); return; }
  if ((el = q('[data-pes]'))) { editPessoal(el.dataset.pes); return; }
  if ((el = q('[data-cedit]'))) { if (!q('[data-act]')) { editCartao(el.dataset.cedit); return; } }
  if ((el = q('[data-cgo]'))) { setCard(+el.dataset.cgo); return; }
  if ((el = q('[data-fx]'))) { state.ui.fluxo = el.dataset.fx; render(); return; }
  if ((el = q('[data-mes]'))) { if (el.dataset.mes !== state.mes) goMes(el.dataset.mes); return; }
  if ((el = q('[data-act]'))) {
    const a = el.dataset.act;
    switch (a) {
      case 'prev': goMes(addMonths(state.mes, -1)); break;
      case 'next': goMes(addMonths(state.mes, 1)); break;
      case 'mpick': monthPicker(el); break;
      case 'bell': bell(el); break;
      case 'addmenu': addMenu(el); break;
      case 'add': escolherAdicionar(); break;
      case 'pdf': imprimirRel(); break;
      case 'add-casa': editCasa(); break;
      case 'add-pes': editPessoal(); break;
      case 'add-cartao': editCartao(); break;
      case 'add-compra': addLancamento(); break;
      case 'add-inv': editInvest(); break;
      case 'add-ger': editGeral(); break;
      case 'add-ext': editExtra(); break;
      case 'nova-cat': editCategoria(null, el.dataset.g); break;
      case 'invest-ini': form({ title: 'Saldo inicial dos investimentos', fields: [{ k: 'investIni', l: 'Quanto você já tinha investido (R$)', t: 'money' }], vals: state, onSave: v => { state.investIni = v.investIni; save(); render(); } }); break;
      case 'renda': editRenda(); break;
      case 'conta': editConta(); break;
      case 'replicar': closePop(); replicarMes(); break;
      case 'nomes': editNomes(); break;
      case 'acerto': { const m = M(); m.acerto = !m.acerto; render(); break; }
      case 'cprev': setCard(state.ui.card - 1); break;
      case 'cnext': setCard(state.ui.card + 1); break;
      case 'ver-fatura': state.ui.view = 'cartoes'; state.ui.fopen = { ...(state.ui.fopen || {}), [el.dataset.c]: true }; render(); break;
      case 'reserva-ini': form({ title: 'Saldo inicial da reserva', fields: [{ k: 'saldoInicial', l: 'Quanto já havia guardado (R$)', t: 'money' }], vals: state.reserva, onSave: v => { state.reserva.saldoInicial = v.saldoInicial; save(); render(); } }); break;
      case 'menu': userMenu(el); break;
      case 'limpar': closePop(); limparLancamentos(); break;
      case 'go': state.ui.view = el.dataset.v; closePop(); render(); break;
      case 'novo-lanc': closePop(); addLancamento(); break;
      case 'exportar': exportar(); break;
      case 'importar': importar(); break;
      case 'sair': closePop(); if (confirm('Sair da conta neste aparelho?')) sair(false); break;
      case 'resetar': closePop(); if (confirm('Apagar todos os seus dados e voltar aos dados iniciais do site?')) { state = seed(); render(); toast('Dados restaurados'); } break;
    }
  }
});
function monthPicker(anchor) {
  let y = parseKey(state.mes).y;
  const paint = () => {
    const sel = parseKey(state.mes);
    return `<div class="yr"><button data-y="-1">${SI.cl}</button><span>${y}</span><button data-y="1">${SI.cr}</button></div><div class="mg">${MAB.map((n, i) => `<button class="${y === sel.y && i === sel.m ? 'on' : ''}" data-m="${i}">${n}</button>`).join('')}</div>`;
  };
  const p = popover(anchor, paint());
  p.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.y) { y += +b.dataset.y; p.innerHTML = paint(); }
    if (b.dataset.m != null) { closePop(); goMes(mkKey(y, +b.dataset.m)); }
  });
}
function bell(anchor) {
  const pd = pendencias();
  const html = `<div class="ph2">Pendências de ${MESES[parseKey(state.mes).m]}</div>` + (pd.n ? pd.items.slice(0, 12).map(i => `<div class="nt1"><span><b>${esc(i.nome)}</b><br><em>vence dia ${pad2(i.dia)}</em></span><b>${brl(i.valor)}</b></div>`).join('') + (pd.acerto ? `<div class="nt1"><span><b>Acerto no Pix</b><br><em>${pd.c.diff > 0 ? esc(nomeEsp()) + ' te devolve' : 'Você devolve'}</em></span><b>${brl(Math.abs(pd.c.diff))}</b></div>` : '') : `<div class="nt1"><span>Tudo em dia neste mês 🎉</span></div>`);
  popover(anchor, `<div style="min-width:300px;max-height:60vh;overflow:auto">${html}</div>`, { align: 'right' });
}
function addMenu(anchor) {
  popover(anchor, `<button class="mi" id="m1">${SI.casaL}Conta da casa</button><button class="mi" id="m2">${SI.user}Gasto pessoal</button><button class="mi" id="m3">${SI.cartao}Compra no cartão (à vista ou parcelada)</button><button class="mi" id="m4">${SI.cartao}Novo cartão</button><button class="mi" id="m6">${SI.invest}Investimento (aporte)</button><button class="mi" id="m7">${SI.renda}Renda extra</button><button class="mi" id="m9">${SI.carrinho}Despesa geral</button><button class="mi" id="m8">${SI.tag}Categoria</button><div class="sep"></div><button class="mi" id="m5">${SI.renda}Editar renda do mês</button>`, { align: 'right' });
  const map = { m1: () => editCasa(), m2: () => editPessoal(), m3: () => addLancamento(), m4: () => editCartao(), m5: () => editRenda(), m6: () => editInvest(), m7: () => editExtra(), m8: () => editCategoria(null, 'despesa'), m9: () => editGeral() };
  layer.querySelector('.pop').addEventListener('click', e => { const b = e.target.closest('.mi'); if (b && map[b.id]) { closePop(); map[b.id](); } });
}
function userMenu(anchor) {
  const p = popover(anchor, `<button class="mi" data-act="nomes">${SI.user}Editar nomes</button><div class="sep"></div><button class="mi" data-act="exportar">${SI.dl}Exportar dados (backup)</button><button class="mi" data-act="importar">${SI.up}Importar dados</button><div class="sep"></div><button class="mi" data-act="replicar">${SI.fluxo}Copiar este mês para os seguintes…</button><button class="mi" data-act="limpar">${SI.lixo}Apagar lançamentos…</button><button class="mi" data-act="resetar">${SI.reset}Restaurar dados iniciais</button>${NUVEM ? `<div class="sep"></div><button class="mi" data-act="sair">${SI.user}Sair${Sync.session ? ' (' + esc(Sync.session.email) + ')' : ''}</button><div class="sub" style="padding:8px 12px;max-width:230px;font-size:11.5px">Os dados são salvos na nuvem e sincronizados com a outra pessoa automaticamente.</div>` : `<div class="sub" style="padding:8px 12px;max-width:230px;font-size:11.5px">Seus dados ficam salvos só neste navegador. Para compartilhar com a outra pessoa, exporte e importe o arquivo.</div>`}`);
  p.style.top = (anchor.getBoundingClientRect().top - p.offsetHeight - 8) + 'px';
  p.addEventListener('click', () => setTimeout(closePop, 0));
}
function exportar() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `duo-finn-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Backup exportado');
}
function importar() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { const s = JSON.parse(r.result); if (!s || (s.v !== 1 && s.v !== 2) || !s.meses) throw 0; migrate(s); if (!confirm('Substituir os dados atuais pelos do arquivo?')) return; state = s; render(); toast('Dados importados'); } catch (e) { toast('Arquivo inválido'); } };
    r.readAsText(f);
  };
  inp.click();
}
render();
if (NUVEM) {
  let ss = null; try { ss = JSON.parse(localStorage.getItem(SK) || 'null'); } catch (e) {}
  if (ss && ss.refresh) { Sync.session = ss; iniciarSync(); } else mostrarLogin();
  setInterval(poll, 15000); window.addEventListener('focus', poll); window.addEventListener('online', poll);
}
})();
